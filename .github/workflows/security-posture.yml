name: Security Posture

on:
  push:
    branches:
      - main
  schedule:
    - cron: "41 4 * * 3"
  workflow_dispatch:

permissions: {}

env:
  SCORECARD_VERSION: "5.5.0"
  SCORECARD_SHA256: "83b90a05c1540ef1390db1cd5711e5fd04be9c1d8537fb84d39d02092d6a8dff"

jobs:
  openssf-scorecard:
    name: openssf-scorecard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Install and verify OpenSSF Scorecard
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/scorecard"
          archive="$RUNNER_TEMP/scorecard.tar.gz"
          mkdir -p "$dir"
          curl --fail --silent --show-error --location --retry 3             --proto '=https' --tlsv1.2             "https://github.com/ossf/scorecard/releases/download/v${SCORECARD_VERSION}/scorecard_${SCORECARD_VERSION}_linux_amd64.tar.gz"             --output "$archive"
          printf '%s  %s\n' "$SCORECARD_SHA256" "$archive" | sha256sum --check -
          tar --extract --gzip --file "$archive" --directory "$dir"
          "$dir/scorecard" version

      - name: Audit repository security posture
        shell: bash
        env:
          GITHUB_AUTH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/scorecard/scorecard"             --repo="github.com/${GITHUB_REPOSITORY}"             --checks=Dangerous-Workflow,Pinned-Dependencies,Token-Permissions,Branch-Protection,Code-Review,Security-Policy,SAST,Vulnerabilities,Dependency-Update-Tool             --show-details
