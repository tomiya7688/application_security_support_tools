name: Security CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
  ZIZMOR_VERSION: "1.30.1"
  ZIZMOR_SHA256: "e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  TRIVY_VERSION: "0.75.0"
  TRIVY_SHA256: "c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f"

jobs:
  workflow-hardening:
    name: workflow-hardening
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install and verify actionlint
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/actionlint"
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          mkdir -p "$dir"
          curl --fail --silent --show-error --location --retry 3             --proto '=https' --tlsv1.2             "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"             --output "$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check -
          tar --extract --gzip --file "$archive" --directory "$dir"
          "$dir/actionlint" -version
          "$dir/actionlint" -color

      - name: Install and verify zizmor
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/zizmor"
          archive="$RUNNER_TEMP/zizmor.tar.gz"
          mkdir -p "$dir"
          curl --fail --silent --show-error --location --retry 3             --proto '=https' --tlsv1.2             "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"             --output "$archive"
          printf '%s  %s\n' "$ZIZMOR_SHA256" "$archive" | sha256sum --check -
          tar --extract --gzip --file "$archive" --directory "$dir"
          "$dir/zizmor" --version

      - name: Audit GitHub Actions security
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/zizmor/zizmor"             --strict-collection             --persona=pedantic             --min-severity=low             --format=github             .

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install and verify Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/gitleaks"
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          mkdir -p "$dir"
          curl --fail --silent --show-error --location --retry 3             --proto '=https' --tlsv1.2             "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"             --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check -
          tar --extract --gzip --file "$archive" --directory "$dir"
          "$dir/gitleaks" version

      - name: Scan repository and history for secrets
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gitleaks/gitleaks" git             --redact             --verbose             .

  filesystem-security:
    name: filesystem-security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install and verify Trivy
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/trivy"
          archive="$RUNNER_TEMP/trivy.tar.gz"
          mkdir -p "$dir"
          curl --fail --silent --show-error --location --retry 3             --proto '=https' --tlsv1.2             "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"             --output "$archive"
          printf '%s  %s\n' "$TRIVY_SHA256" "$archive" | sha256sum --check -
          tar --extract --gzip --file "$archive" --directory "$dir"
          "$dir/trivy" --version

      - name: Scan vulnerabilities, misconfiguration, and secrets
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/trivy/trivy" fs             --scanners vuln,misconfig,secret             --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL             --exit-code 1             --no-progress             --timeout 10m             --skip-dirs .git             .

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          fail-on-scopes: runtime, development, unknown
          vulnerability-check: true
          license-check: true
          show-openssf-scorecard: true
          warn-on-openssf-scorecard-level: 5
          retry-on-snapshot-warnings: true

  protocol-contract:
    name: protocol-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify security contract files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          paths = [
              Path("schemas/common-request.schema.json"),
              Path("schemas/common-response.schema.json"),
          ]
          for path in paths:
              doc = json.loads(path.read_text(encoding="utf-8"))
              assert doc["$schema"] == "https://json-schema.org/draft/2020-12/schema"
              assert doc["type"] == "object"
              assert doc["additionalProperties"] is False
              assert isinstance(doc.get("required"), list) and doc["required"]

          text = Path("docs/input-output-security.md").read_text(encoding="utf-8")
          invariants = [
              "duplicate JSON object keys",
              "UTF-8",
              "before parsing",
              "raw request",
              "stderr",
              "fail closed",
          ]
          missing = [item for item in invariants if item not in text]
          if missing:
              raise SystemExit(f"missing input/output security invariants: {missing}")
          PY
